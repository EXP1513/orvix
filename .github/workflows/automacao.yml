name: Execução a cada 10 minutos Orvyx -> Aba ATUAL

on:
  schedule:
    # Executa automaticamente a cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite executar manualmente também

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install playwright gspread google-auth
        playwright install chromium

    - name: Executar Script Python
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: |
        python main.py
