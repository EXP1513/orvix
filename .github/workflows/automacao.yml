name: Execução de 1 hora Orvyx -> Aba ATUAL

on:
  schedule:
    # Executa automaticamente no minuto 0 de cada hora
    - cron: '0 * * * *'
  workflow_dispatch: # Permite disparar o teste manualmente pelo botão no GitHub

jobs:
  executar-automacao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências e Playwright
        run: |
          python -m pip install --upgrade pip
          pip install pandas lxml openpyxl gspread google-auth playwright
          playwright install --with-deps

      - name: Executar Script Python
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python main.py
